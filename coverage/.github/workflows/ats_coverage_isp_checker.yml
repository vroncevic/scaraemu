name: ats_coverage_isp_checker

permissions:
  contents: read

on:
  push:
    branches: [ main ]
    paths:
      - 'ats_coverage.py'
      - 'ats_updater.py'
      - 'setup.py'
  pull_request:
    branches: [ main ]
    paths:
      - 'ats_coverage.py'
      - 'ats_updater.py'
      - 'setup.py'

jobs:
  isp_gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Check Interface Segregation Principle violations
        run: |
          python3 gates/gates/isp_checker.py .
